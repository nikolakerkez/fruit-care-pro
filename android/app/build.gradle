plugins {
    id "com.android.application"
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services' // Firebase
    id 'com.google.firebase.crashlytics' // Firebase Crashlytics
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "rs.nikolakerkez.fruitcarepro"

    compileSdk = 36 // mora 36 zbog novih pluginova

    defaultConfig {
        applicationId = "rs.nikolakerkez.fruitcarepro"
        minSdkVersion = flutter.minSdkVersion // radi i na starijim telefonima
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        apiVersion = "1.9"
        languageVersion = "1.9"
    }

      buildTypes {
        release {
            // Stara linija: isMinifyEnabled = true -> zameni sa:
            minifyEnabled true
            // Debuggable se više ne stavlja na release
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro",
                "$rootDir/flutter_proguard_rules.pro"
            )
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

// Kopiraj APK na mesto gde Flutter očekuje
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.doLast {
            copy {
                from 'build/outputs/apk/debug'
                into '../../build/app/outputs/flutter-apk'
                include 'app-debug.apk'
            }
        }
    }

    if (task.name == 'assembleRelease') {
        task.doLast {
            copy {
                from 'build/outputs/apk/release'
                into '../../build/app/outputs/flutter-apk'
                include 'app-release.apk'
            }
        }
    }
}